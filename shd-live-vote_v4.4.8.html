// =====================================================
// 日本語テキストを意味のある単語に分割
function tokenizeJa(text) {
  const results = [];
  // ストップワード（意味のない助詞・助動詞など）
  const stopWords = new Set([
    "は","が","を","に","で","と","の","も","や","から","まで","より","へ","か","な",
    "た","て","だ","です","ます","する","した","して","いる","ある","ない","れる","られる",
    "こと","もの","これ","それ","あれ","ここ","そこ","あそこ","いう","思う","なる","いい",
    "ので","けど","でも","しか","だけ","など","まあ","よね","ね","よ","さ","わ","って",
    "ちょっと","すごく","とても","かなり","もう","まだ","また","ずっと","ちゃんと"
  ]);
  // 英数字
  (text.match(/[a-zA-Z]{3,}/g) || []).forEach(w => {
    const lw = w.toLowerCase();
    if(!stopWords.has(lw)) results.push(lw);
  });
  // 漢字・カタカナの単語（2〜8文字）
  (text.match(/[一-龯ァ-ン]{2,8}/g) || []).forEach(w => {
    if(!stopWords.has(w)) results.push(w);
  });
  // ひらがな（3文字以上でストップワード除外）
  (text.match(/[ぁ-ん]{3,6}/g) || []).forEach(w => {
    if(!stopWords.has(w)) results.push(w);
  });
  return results;
}

// スパイラル配置・重なり防止ワードクラウド（共通関数）
function buildWordCloud(container, comments, darkMode) {
  const freq = {};
  comments.forEach(c => {
    tokenizeJa(c.text || "").forEach(w => { freq[w] = (freq[w] || 0) + 1; });
  });
  const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,30);
  if(sorted.length === 0) {
    container.innerHTML = "<div style='display:flex;align-items:center;justify-content:center;height:100%;color:" + (darkMode?"rgba(255,255,255,0.4)":"#6B7280") + ";font-size:14px;'>コメントがまだありません</div>";
    return;
  }
  const maxF = sorted[0][1];
  const W = container.offsetWidth || 800;
  const H = container.offsetHeight || 500;
  const cx = W/2, cy = H/2;
  const colors = darkMode
    ? ["#49C1F0","#E95098","#93C85A","#FFF21A","#FF8C42","#A855F7","#22D3EE","#FB923C"]
    : ["#1D2088","#E95098","#2196F3","#FF9800","#4CAF50","#9C27B0","#00BCD4","#FF5722"];

  // 既存要素を保持（アニメーション用）
  const existingEls = {};
  container.querySelectorAll(".wc-w").forEach(el => { existingEls[el.dataset.w] = el; });

  const placed = [];
  const newPos = {};
  const newWords = new Set(sorted.map(e => e[0]));

  sorted.forEach((entry, i) => {
    const word = entry[0], f = entry[1];
    const size = Math.max(13, Math.min(52, 13 + Math.round((f/maxF)*39)));
    // 文字幅推定（漢字・かな・カタカナは正方形）
    const isWide = /[ぁ-んァ-ン一-龯]/.test(word);
    const cw = isWide ? size * 1.02 : size * 0.60;
    const ww = word.length * cw + 14; // 単語の幅
    const wh = size * 1.55;           // 単語の高さ
    const mg = 7; // マージン

    let x = cx, y = cy, placed_ok = false;
    let angle = 0, r = 0;
    for(let t = 0; t < 2500; t++) {
      x = cx + r * Math.cos(angle);
      y = cy + r * Math.sin(angle) * 0.58;
      const L = x - ww/2 - mg, R = x + ww/2 + mg;
      const T = y - wh/2 - mg, B = y + wh/2 + mg;
      if(L > 2 && R < W-2 && T > 2 && B < H-2) {
        placed_ok = true;
        for(let p of placed) {
          if(!(R < p.L || L > p.R || B < p.T || T > p.B)) { placed_ok = false; break; }
        }
        if(placed_ok) break;
      }
      angle += 0.26; r += 0.13;
    }
    if(!placed_ok) { newPos[word] = null; return; }
    placed.push({L:x-ww/2-mg, R:x+ww/2+mg, T:y-wh/2-mg, B:y+wh/2+mg});
    newPos[word] = {x, y, size, color:colors[i%colors.length]};
  });

  // 削除
  Object.keys(existingEls).forEach(w => {
    if(!newWords.has(w) || !newPos[w]) {
      existingEls[w].style.opacity = "0";
      setTimeout(() => { if(existingEls[w].parentNode) existingEls[w].remove(); }, 500);
    }
  });

  // 更新・追加
  sorted.forEach(entry => {
    const word = entry[0];
    const pos = newPos[word];
    if(!pos) return;
    let el = existingEls[word];
    if(el) {
      el.style.cssText += ";left:" + pos.x + "px;top:" + pos.y + "px;font-size:" + pos.size + "px;color:" + pos.color + ";";
    } else {
      el = document.createElement("div");
      el.className = "wc-w";
      el.dataset.w = word;
      el.textContent = word;
      el.style.cssText = "position:absolute;font-family:メイリオ,Meiryo,sans-serif;font-weight:700;white-space:nowrap;transform:translate(-50%,-50%);transition:all 0.6s ease;opacity:0;left:" + pos.x + "px;top:" + pos.y + "px;font-size:" + pos.size + "px;color:" + pos.color + ";";
      container.appendChild(el);
      requestAnimationFrame(() => { el.style.opacity = "0.92"; });
    }
  });
}

    if(liveVoteIdx>=0 && liveVoteIdx===currentVoteIdx) {
      info.style.display="block";
      info.innerHTML='<div class="live-banner"><span class="lb-dot"></span>この設問は現在配信中です</div>';
    } else if(liveVoteIdx>=0) {
      info.style.display="block";
      info.innerHTML='<div style="background:#F8F9FF;border:1px solid var(--bdr);border-radius:6px;padding:7px 10px;font-size:10px;color:var(--txt2);">📡 現在配信中：Q'+(liveVoteIdx+1)+'<br>「📊 投票を配信」でこの設問に切り替えられます</div>';
    } else { info.style.display="none"; }
  }
  function loadQ(idx) {
    const q = questions[idx];
    document.getElementById("a-q").value = q?q.question:"";
    document.getElementById("a-chart-type").value = q?q.chartType:"horizontal";
    buildOptList(q?q.options:["",""]);
  }
  function buildOptList(opts) {
    const list = document.getElementById("opt-list"); list.innerHTML="";
    (opts||["",""]).forEach(v => addOptRow(v));
  }
  function addOptRow(val) {
    const list = document.getElementById("opt-list");
    if(list.children.length>=8){aToast("⚠️ 最大8つです");return;}
    const row=document.createElement("div"); row.style.cssText="display:flex;gap:5px;align-items:center;margin-bottom:5px;";
    const inp=document.createElement("input"); inp.type="text"; inp.className="fi oi"; inp.placeholder="選択肢"; inp.value=val||"";
    const btn=document.createElement("button"); btn.style.cssText="background:transparent;border:1px solid #FCA5A5;border-radius:4px;color:#EF4444;cursor:pointer;width:24px;height:24px;font-size:12px;flex-shrink:0;";
    btn.textContent="✕"; btn.onclick=()=>{ if(list.children.length<=2){aToast("⚠️ 最低2つ必要です");return;} row.remove(); };
    row.appendChild(inp); row.appendChild(btn); list.appendChild(row);
  }
  initQTabs(); buildOptList(["",""]);

  // アコーディオン
  document.querySelectorAll(".acc-h").forEach(h => {
    h.addEventListener("click", () => {
      const b = document.querySelector("[data-b='"+h.dataset.i+"']");
      const open = h.classList.contains("open");
      h.classList.toggle("open",!open); b.classList.toggle("open",!open);
      h.querySelector(".acc-ar").textContent = open?"▼":"▲";
    });
  });

  // 右パネルタブ（手動切替用）
  document.querySelectorAll(".rtab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".rtab").forEach(x=>x.classList.remove("on"));
      document.querySelectorAll(".rtp").forEach(x=>x.classList.remove("on"));
      tab.classList.add("on");
      document.getElementById("rp-"+tab.dataset.t).classList.add("on");
    });
  });

  // コメント表示切替 → Firebaseに書き込んで全画面同期
  document.querySelectorAll(".ctab").forEach(tab => {
    tab.addEventListener("click", () => {
      db.ref("session/displayMode").set(tab.dataset.ct);
    });
  });

  // 配信中インジケータ更新
  function updateIndicators() {
    document.getElementById("rtab-c").classList.toggle("live", broadcastMode==="comment");
    document.getElementById("rtab-v").classList.toggle("live", broadcastMode==="vote");
    document.getElementById("ctab-list").classList.toggle("live", broadcastMode==="comment" && displayMode==="list");
    document.getElementById("ctab-cloud").classList.toggle("live", broadcastMode==="comment" && displayMode==="cloud");
  }

  // コメント表示モード適用
  function applyDisplayMode(dm) {
    displayMode = dm||"list";
    document.querySelectorAll(".ctab").forEach(t=>t.classList.remove("on"));
    document.querySelector(".ctab[data-ct='"+displayMode+"']")?.classList.add("on");
    const clEl = document.getElementById("a-cl");
    clEl.style.display = displayMode==="list" ? "flex" : "none";
    clEl.style.flexDirection = "column";
    document.getElementById("a-wc").style.display = displayMode==="cloud"?"block":"none";
    if(displayMode==="cloud") buildWordCloud(document.getElementById("a-wc"), allComments, false);
    updateIndicators();
  }

  // 右パネルをモードに合わせて自動切替
  function syncRightPanel(mode) {
    document.querySelectorAll(".rtab").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".rtp").forEach(x=>x.classList.remove("on"));
    const t = mode==="vote"?"v":"c";
    document.getElementById("rtab-"+t)?.classList.add("on");
    document.getElementById("rp-"+t)?.classList.add("on");
  }

  // ボタン
  document.getElementById("a-start").addEventListener("click", () => {
    db.ref("session").set({active:true,mode:"comment",displayMode:"list",startedAt:firebase.database.ServerValue.TIMESTAMP})
      .then(()=>aToast("✅ セッションを開始しました"));
  });
  document.getElementById("a-toC").addEventListener("click", () => {
    if(!sessionActive){aToast("⚠️ 先にセッションを開始してください");return;}
    db.ref("session").set({active:true,mode:"comment",displayMode,updatedAt:firebase.database.ServerValue.TIMESTAMP})
      .then(()=>aToast("✅ コメント配信に切り替えました"));
  });
  document.getElementById("a-toV").addEventListener("click", () => {
    if(!sessionActive){aToast("⚠️ 先にセッションを開始してください");return;}
    const q = questions[currentVoteIdx];
    if(!q){aToast("⚠️ Q"+(currentVoteIdx+1)+"を先に保存してください");return;}
    db.ref("votes").remove().then(()=>
      db.ref("session").set({active:true,mode:"vote",vote:q,voteIdx:currentVoteIdx,displayMode,updatedAt:firebase.database.ServerValue.TIMESTAMP})
    ).then(()=>{
      liveVoteIdx=currentVoteIdx; initQTabs(); updateLiveInfo();
      aToast("✅ Q"+(currentVoteIdx+1)+"を配信開始（投票リセット済み）");
    });
  });
  document.getElementById("a-end").addEventListener("click", () => {
    showModal("セッションを終了しますか？","参加者・表示画面が待機状態になります。",()=>{
      db.ref("session").set({active:false}).then(()=>{liveVoteIdx=-1;initQTabs();updateLiveInfo();aToast("⏹ 終了しました");});
    });
  });
  document.getElementById("a-save").addEventListener("click", () => {
    const q=document.getElementById("a-q").value.trim();
    const ct=document.getElementById("a-chart-type").value;
    const opts=Array.from(document.querySelectorAll(".oi")).map(i=>i.value.trim()).filter(Boolean);
    if(!q){aToast("⚠️ 質問文を入力してください");return;}
    if(opts.length<2){aToast("⚠️ 選択肢を2つ以上入力してください");return;}
    questions[currentVoteIdx]={question:q,options:opts,chartType:ct};
    db.ref("questions/"+currentVoteIdx).set({question:q,options:opts,chartType:ct});
    initQTabs(); updateLiveInfo(); aToast("💾 Q"+(currentVoteIdx+1)+"を保存しました");
  });
  document.getElementById("a-addopt").addEventListener("click",()=>addOptRow(""));
  document.getElementById("a-cp").addEventListener("click",()=>navigator.clipboard.writeText(document.getElementById("u-p").textContent).then(()=>aToast("📋 コピーしました")));
  document.getElementById("a-cd").addEventListener("click",()=>navigator.clipboard.writeText(document.getElementById("u-d").textContent).then(()=>aToast("📋 コピーしました")));
  document.getElementById("a-qr").addEventListener("click",()=>{
    const url=BASE_URL+"?mode=participant";
    const box=document.getElementById("qr-b"); box.innerHTML="";
    try{ new QRCode(box,{text:url,width:170,height:170,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M}); document.getElementById("qr-l").textContent=url; document.getElementById("qr-w").style.display="block"; aToast("✅ QRコードを生成しました"); }catch(e){aToast("❌ 生成に失敗しました");}
  });
  document.getElementById("a-clrC").addEventListener("click",()=>showModal("コメントをクリアしますか？","全てのコメントが削除されます。",()=>db.ref("comments").remove().then(()=>aToast("🗑 クリアしました"))));
  document.getElementById("a-clrV").addEventListener("click",()=>showModal("投票結果をリセットしますか？","全ての投票データが削除されます。",()=>db.ref("votes").remove().then(()=>aToast("🗑 リセットしました"))));
  document.getElementById("a-clrQ").addEventListener("click",()=>showModal("設問をリセットしますか？","全設問が削除されます。",()=>db.ref("questions").remove().then(()=>{questions=[];currentVoteIdx=0;liveVoteIdx=-1;initQTabs();buildOptList(["",""]);document.getElementById("a-q").value="";aToast("🗑 設問をリセットしました");})));
  document.getElementById("a-mno").addEventListener("click",closeModal);
  document.getElementById("a-mbg").addEventListener("click",e=>{if(e.target===document.getElementById("a-mbg"))closeModal();});

  // 設問復元
  db.ref("questions").once("value",s=>{s.forEach(c=>{questions[parseInt(c.key)]=c.val();}); initQTabs(); loadQ(currentVoteIdx);});

  // Firebase監視
  db.ref("participants").on("value",s=>document.getElementById("a-pc").textContent=s.numChildren());
  db.ref("comments").on("value",s=>{
    const n=s.numChildren(); document.getElementById("a-cc").textContent=n; document.getElementById("a-cnt").textContent=n>0?"("+n+")":"";
    allComments=[];
    s.forEach(c=>allComments.push(Object.assign({key:c.key},c.val())));
    renderAComments();
    if(displayMode==="cloud") buildWordCloud(document.getElementById("a-wc"),allComments,false);
  });
  db.ref("votes").on("value",s=>{
    const n=s.numChildren(); document.getElementById("a-vc2").textContent=n; document.getElementById("a-vt").textContent=n+" 票";
    if(currentVote) renderAVoteChart(s,currentVote);
  });
  let prevSessionMode = null; // 直前のセッションモードを記憶
  db.ref("session").on("value",s=>{
    const session=s.val();
    sessionActive=!!(session&&session.active);
    const badge=document.getElementById("amb");
    const txt=document.getElementById("a-mt");
    badge.className="";
    const newMode = session&&session.active ? session.mode : null;
    const modeChanged = newMode !== prevSessionMode;
    prevSessionMode = newMode;
    if(!session||!session.active){txt.textContent="待機中";liveVoteIdx=-1;broadcastMode="comment";}
    else if(session.mode==="comment"){badge.classList.add("c");txt.textContent="💬 コメント配信中";broadcastMode="comment";
      // モードが切り替わった時だけ右パネルを自動切替（手動切替を上書きしない）
      if(modeChanged) syncRightPanel("comment");
    }
    else if(session.mode==="vote"){badge.classList.add("v");txt.textContent="📊 投票配信中";broadcastMode="vote";currentVote=session.vote;if(session.voteIdx!==undefined)liveVoteIdx=session.voteIdx;
      if(modeChanged) syncRightPanel("vote");
    }
    if(session&&session.displayMode) applyDisplayMode(session.displayMode);
    else applyDisplayMode("list");
    initQTabs(); updateLiveInfo(); updateIndicators();
  });

  function renderAComments() {
    const container=document.getElementById("a-cl");
    if(allComments.length===0){container.innerHTML="<div style='color:#6B7280;font-size:13px;text-align:center;padding:40px 0;'>コメントがまだありません</div>";return;}
    const items=[...allComments].sort((a,b)=>a.timestamp-b.timestamp);
    const atBottom=container.scrollHeight-container.scrollTop<=container.clientHeight+60;
    container.innerHTML="";
    items.forEach(item=>{
      const wrap=document.createElement("div"); wrap.className="cbw";
      const av=document.createElement("div"); av.className="cav"; av.textContent=(item.name||"匿名").charAt(0);
      const bd=document.createElement("div"); bd.className="cbd";
      const nm=document.createElement("div"); nm.className="cnm"; nm.textContent=item.name||"匿名";
      const bub=document.createElement("div"); bub.className="cbub"+(item.pinned?" pin":""); bub.textContent=item.text;
      const ac=document.createElement("div"); ac.className="cac";
      const pb=document.createElement("button"); pb.className="abt"; pb.textContent=item.pinned?"📌 解除":"📌 ピン";
      pb.onclick=()=>db.ref("comments/"+item.key).update({pinned:!item.pinned});
      const dl=document.createElement("button"); dl.className="abt dl"; dl.textContent="🗑 削除";
      dl.onclick=()=>db.ref("comments/"+item.key).remove().then(()=>aToast("🗑 削除しました"));
      const tm=document.createElement("div"); tm.className="ctm"; tm.textContent=new Date(item.timestamp).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
      ac.appendChild(pb); ac.appendChild(dl); bd.appendChild(nm); bd.appendChild(bub); bd.appendChild(ac);
      wrap.appendChild(av); wrap.appendChild(bd); wrap.appendChild(tm); container.appendChild(wrap);
    });
    if(atBottom) container.scrollTop=container.scrollHeight;
  }

  function renderAVoteChart(snap,config) {
    const counts={}; (config.options||[]).forEach(o=>{counts[o]=0;});
    snap.forEach(v=>{const a=v.val().answer;if(counts[a]!==undefined)counts[a]++;});
    const labels=config.options||[]; const data=labels.map(l=>counts[l]||0);
    const ct=config.chartType||"horizontal"; const isH=ct==="horizontal";
    document.getElementById("v-no").style.display="none";
    document.getElementById("a-vwrap").style.display="block";
    if(aChart){aChart.destroy();aChart=null;}
    aChart=new Chart(document.getElementById("a-vchart"),{
      type:ct==="doughnut"?"doughnut":"bar",
      data:{labels,datasets:[{label:"票数",data,backgroundColor:CHART_COLORS.map(c=>c+"cc"),borderColor:CHART_COLORS,borderWidth:2,borderRadius:ct!=="doughnut"?5:0}]},
      options:{indexAxis:isH?"y":"x",responsive:true,maintainAspectRatio:false,animation:{duration:500},
        plugins:{legend:{display:ct==="doughnut",labels:{font:{family:"メイリオ,Meiryo,sans-serif",size:11}}},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);const p=t>0?Math.round(c.raw/t*100):0;return " "+c.raw+" 票（"+p+"%）";}}}},
        scales:ct!=="doughnut"?{x:{ticks:{font:{family:"メイリオ,Meiryo,sans-serif",size:10}},grid:{color:"rgba(0,0,0,0.05)"}},y:{ticks:{font:{family:"メイリオ,Meiryo,sans-serif",size:10}},grid:{color:"rgba(0,0,0,0.05)"},beginAtZero:true}}:{}}
    });
  }

  // resizeCommentArea は CSS flex で不要（削除）

  function showModal(title,body,onOk){document.getElementById("a-mt2").textContent=title;document.getElementById("a-mb2").textContent=body;document.getElementById("a-mok").onclick=()=>{onOk();closeModal();};document.getElementById("a-mbg").classList.add("show");}
  function closeModal(){document.getElementById("a-mbg").classList.remove("show");}
  function aToast(msg){const t=document.getElementById("a-toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}
}

// =====================================================
// 参加者画面
// =====================================================
function buildParticipant() {
  const style=document.createElement("style");
  style.textContent=`
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap");
    body{background:#0d1156;font-family:メイリオ,Meiryo,"Noto Sans JP",sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;}
    #ph{background:linear-gradient(135deg,#1D2088,#2d35a8);padding:12px 18px;border-bottom:3px solid #E95098;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .pl{font-size:15px;font-weight:900;letter-spacing:0.1em;} .pl span{color:#E95098;}
    #pst{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.7);}
    .pd{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pulse 1.5s infinite;}
    .pd.off{background:#666;animation:none;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    #pnm{background:rgba(255,255,255,0.05);margin:14px;border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,0.1);flex-shrink:0;}
    #pnm label{font-size:11px;color:rgba(255,255,255,0.6);margin-bottom:7px;display:block;}
    #pni{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:9px 12px;font-size:14px;color:#fff;font-family:メイリオ,Meiryo,sans-serif;outline:none;}
    /* メインコンテンツエリア（1画面に1つのみ表示） */
    #p-content{flex:1;display:flex;flex-direction:column;}
    .p-section{display:none;flex:1;flex-direction:column;}
    .p-section.on{display:flex;}
    /* 待機画面 */
    #p-sb{align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 20px;}
    /* コメント入力画面 */
    #p-cs{padding:0 14px 14px;gap:9px;}
    #p-cs h2{font-size:13px;font-weight:700;color:#49C1F0;flex-shrink:0;}
    #pci{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:9px;padding:11px 13px;font-size:14px;color:#fff;font-family:メイリオ,Meiryo,sans-serif;resize:none;min-height:80px;outline:none;line-height:1.6;flex-shrink:0;}
    #pcc{text-align:right;font-size:10px;color:rgba(255,255,255,0.4);flex-shrink:0;}
    #psend{width:100%;background:linear-gradient(135deg,#E95098,#c0306a);border:none;border-radius:9px;padding:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:メイリオ,Meiryo,sans-serif;transition:opacity 0.2s;flex-shrink:0;}
    #psend:disabled{opacity:0.4;cursor:not-allowed;}
    #plog{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px;max-height:160px;}
    .pli{background:rgba(255,255,255,0.05);border-left:3px solid #4CAF50;border-radius:5px;padding:7px 10px;font-size:12px;color:rgba(255,255,255,0.7);}
    /* 投票画面 */
    #p-vs{padding:0 14px 14px;gap:10px;overflow-y:auto;}
    #pvnum{font-size:11px;color:rgba(255,255,255,0.5);text-align:center;flex-shrink:0;}
    #pvq{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:14px;font-size:15px;font-weight:700;line-height:1.5;text-align:center;flex-shrink:0;}
    #pvopts{display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
    .pvo{background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:9px;padding:12px 16px;font-size:14px;font-family:メイリオ,Meiryo,sans-serif;color:#fff;cursor:pointer;text-align:left;width:100%;transition:all 0.2s;flex-shrink:0;}
    .pvo:hover{border-color:#49C1F0;background:rgba(73,193,240,0.1);}
    .pvo.sel{border-color:#4CAF50;background:rgba(76,175,80,0.15);font-weight:700;}
    .pvo:disabled{opacity:0.5;cursor:not-allowed;}
    #pvoted{text-align:center;padding:18px;font-size:17px;font-weight:700;color:#4CAF50;display:none;flex-shrink:0;}
    #p-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:#1D2088;border:1px solid #49C1F0;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;transition:transform 0.3s;z-index:100;}
    #p-toast.show{transform:translateX(-50%) translateY(0);}
  `;
  document.head.appendChild(style);

  document.getElementById("app").innerHTML=`
    <div id="ph"><div class="pl">SHD <span>LIVE</span></div><div id="pst"><div class="pd off" id="pdot"></div><span id="pstxt">接続中...</span></div></div>
    <div id="pnm"><label>お名前（任意・省略可）</label><input type="text" id="pni" placeholder="例：山田 太郎" maxlength="20"></div>
    <div id="p-content">
      <div id="p-sb" class="p-section on">
        <div style="font-size:44px;">📡</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.5);line-height:1.8;">セッションが開始されると<br>コメント・投票が表示されます</div>
      </div>
      <div id="p-cs" class="p-section">
        <h2>💬 コメントを送る</h2>
        <textarea id="pci" placeholder="質問・感想を自由に入力してください..." maxlength="200"></textarea>
        <div id="pcc">0 / 200</div>
        <button id="psend">送信する</button>
        <div id="plog"></div>
      </div>
      <div id="p-vs" class="p-section">
        <div id="pvnum"></div>
        <div id="pvq">質問を読み込み中...</div>
        <div id="pvopts"></div>
        <div id="pvoted">✅ 回答を送信しました！</div>
      </div>
    </div>
    <div id="p-toast"></div>
  `;

  const pId="p_"+Date.now()+"_"+Math.random().toString(36).substr(2,6);
  let hasVoted=false, currentVoteKey="";

  // 画面切替（完全に1つだけ表示）
  function showSection(id) {
    document.querySelectorAll(".p-section").forEach(s=>s.classList.remove("on"));
    document.getElementById(id)?.classList.add("on");
  }

  document.getElementById("pci").addEventListener("input",function(){ document.getElementById("pcc").textContent=this.value.length+" / 200"; });
  document.getElementById("psend").addEventListener("click",function(){
    const text=document.getElementById("pci").value.trim();
    const name=document.getElementById("pni").value.trim()||"匿名";
    if(!text) return;
    this.disabled=true; const btn=this;
    db.ref("comments").push({name,text,timestamp:firebase.database.ServerValue.TIMESTAMP,pinned:false}).then(()=>{
      const log=document.getElementById("plog");
      const li=document.createElement("div"); li.className="pli"; li.textContent=text;
      log.insertBefore(li,log.firstChild);
      if(log.children.length>5) log.removeChild(log.lastChild);
      document.getElementById("pci").value=""; document.getElementById("pcc").textContent="0 / 200";
      pToast("✅ 送信しました！");
      setTimeout(()=>{btn.disabled=false;},2000);
    });
  });

  db.ref("session").on("value",s=>{
    const session=s.val();
    const dot=document.getElementById("pdot");
    const stxt=document.getElementById("pstxt");
    if(!session||!session.active){
      dot.className="pd off"; stxt.textContent="待機中";
      showSection("p-sb"); currentVoteKey=""; return;
    }
    dot.className="pd";
    db.ref("participants/"+pId).set({name:(document.getElementById("pni").value||"匿名"),joinedAt:firebase.database.ServerValue.TIMESTAMP});
    db.ref("participants/"+pId).onDisconnect().remove();

    if(session.mode==="comment"){
      stxt.textContent="💬 コメントモード";
      showSection("p-cs");
      currentVoteKey="";
    } else if(session.mode==="vote"&&session.vote){
      stxt.textContent="📊 投票モード";
      showSection("p-vs");
      const voteKey="idx"+(session.voteIdx||0)+"_"+(session.vote.question||"");
      if(voteKey!==currentVoteKey){
        currentVoteKey=voteKey; hasVoted=false;
        document.getElementById("pvoted").style.display="none";
        buildVoteOpts(session.vote,session.voteIdx);
      }
    }
  });

  function buildVoteOpts(vc,idx){
    document.getElementById("pvnum").textContent="設問 Q"+((idx!==undefined?idx:0)+1);
    document.getElementById("pvq").textContent=vc.question||"投票";
    const container=document.getElementById("pvopts"); container.innerHTML="";
    (vc.options||[]).forEach(opt=>{
      const btn=document.createElement("button"); btn.className="pvo"; btn.textContent=opt;
      btn.addEventListener("click",()=>{
        if(hasVoted) return; hasVoted=true;
        const name=document.getElementById("pni").value.trim()||"匿名";
        db.ref("votes/"+pId).set({name,answer:opt,timestamp:firebase.database.ServerValue.TIMESTAMP}).then(()=>{
          document.querySelectorAll(".pvo").forEach(b=>{b.disabled=true;if(b.textContent===opt)b.classList.add("sel");});
          document.getElementById("pvoted").style.display="block";
          pToast("✅ 投票しました！");
        });
      });
      container.appendChild(btn);
    });
  }

  function pToast(msg){const t=document.getElementById("p-toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
}

// =====================================================
// 表示画面（display）
// 管理画面の右パネルと同じロジックで描画
// =====================================================
function buildDisplay() {
  const style=document.createElement("style");
  style.textContent=`
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap");
    body{background:rgba(10,14,61,0.92);font-family:メイリオ,Meiryo,"Noto Sans JP",sans-serif;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
    #dh{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:linear-gradient(90deg,#1D2088,#2d35a8);border-bottom:2px solid #E95098;flex-shrink:0;}
    .dl{font-size:12px;font-weight:700;color:#fff;letter-spacing:0.08em;} .dl span{color:#E95098;}
    #dmb{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,0.8);}
    .dd{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    #dpc{background:rgba(255,255,255,0.15);border-radius:20px;padding:2px 10px;font-size:11px;}
    #d-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
    /* 各表示エリア（1つだけ表示） */
    .d-sec{display:none;flex:1;} .d-sec.on{display:flex;}
    /* 待機 */
    #d-standby{align-items:center;justify-content:center;flex-direction:column;gap:18px;color:rgba(255,255,255,0.4);}
    /* コメントリスト */
    #d-cl{flex-direction:column;padding:14px;gap:7px;overflow:hidden;}
    #d-cls{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:3px;scroll-behavior:smooth;}
    #d-cls::-webkit-scrollbar{width:3px;} #d-cls::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px;}
    .dcc{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-left:3px solid #E95098;border-radius:7px;padding:9px 12px;animation:su 0.4s ease-out;}
    @keyframes su{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .dcc.pin{border-left-color:#FFF21A;background:rgba(255,242,26,0.1);}
    .dcm{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
    .dcn{font-size:10px;font-weight:700;color:#49C1F0;}
    .dct{font-size:9px;color:rgba(255,255,255,0.4);margin-left:auto;}
    .dcx{font-size:14px;color:#fff;line-height:1.55;word-break:break-all;}
    /* ワードクラウド */
    #d-wc{position:relative;overflow:hidden;}
    /* 投票 */
    #d-vp{flex-direction:column;padding:18px;gap:12px;}
    #dvnum{font-size:12px;color:rgba(255,255,255,0.5);text-align:center;flex-shrink:0;}
    #dvq{font-size:19px;font-weight:900;color:#fff;text-align:center;line-height:1.4;flex-shrink:0;}
    #dvs{display:flex;justify-content:center;font-size:11px;color:rgba(255,255,255,0.6);flex-shrink:0;}
    #dch{flex:1;position:relative;min-height:0;}
    #d-ft{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:7px 14px;background:rgba(0,0,0,0.4);border-top:1px solid rgba(255,255,255,0.1);flex-shrink:0;}
    #d-ft label{font-size:10px;color:rgba(255,255,255,0.5);}
    .bgbtn{font-size:10px;padding:3px 9px;border-radius:4px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;font-family:メイリオ,Meiryo,sans-serif;transition:all 0.2s;}
    .bgbtn.on{background:#1D2088;border-color:#49C1F0;color:#fff;}
  `;
  document.head.appendChild(style);

  document.getElementById("app").innerHTML=`
    <div id="dh">
      <div class="dl">SHD <span>LIVE</span></div>
      <div id="dmb"><div class="dd"></div><span id="dml">待機中</span></div>
      <div id="dpc">👥 0 名</div>
    </div>
    <div id="d-body">
      <div id="d-standby" class="d-sec on"><div style="font-size:44px;opacity:0.3;">📡</div><div style="font-size:13px;text-align:center;">管理者がセッションを開始すると<br>ここに表示されます</div></div>
      <div id="d-cl" class="d-sec"><div id="d-cls"></div></div>
      <div id="d-wc" class="d-sec"></div>
      <div id="d-vp" class="d-sec">
        <div id="dvnum"></div>
        <div id="dvq">質問がここに表示されます</div>
        <div id="dvs">総回答数：<span id="dvt">0</span> 票</div>
        <div id="dch"><canvas id="dchart"></canvas></div>
      </div>
    </div>
    <div id="d-ft">
      <label>背景：</label>
      <button class="bgbtn on" data-bg="overlay">半透明</button>
      <button class="bgbtn" data-bg="solid">濃色</button>
      <button class="bgbtn" data-bg="clear">透明</button>
    </div>
  `;

  document.querySelectorAll(".bgbtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".bgbtn").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
      const bg=btn.dataset.bg;
      document.body.style.background=bg==="overlay"?"rgba(10,14,61,0.92)":bg==="solid"?"#080c28":"transparent";
    });
  });

  // 表示セクション切替
  function showD(id) {
    document.querySelectorAll(".d-sec").forEach(s=>s.classList.remove("on"));
    document.getElementById(id)?.classList.add("on");
  }

  let dChart=null, vListener=null;
  let cachedComments=[], currentDVote=null;
  let prevDMode=null, prevDDisplayMode=null; // 直前のモードを記憶して不要な再設定を防ぐ

  db.ref("participants").on("value",s=>document.getElementById("dpc").textContent="👥 "+s.numChildren()+" 名");

  // コメントリスナーは永続的に維持（セッション変化で切断しない）
  db.ref("comments").orderByChild("timestamp").on("value",snap=>{
    cachedComments=[];
    snap.forEach(c=>cachedComments.push(Object.assign({key:c.key},c.val())));
    // 現在コメントモードなら即時更新
    if(prevDMode==="comment"){
      if(prevDDisplayMode==="cloud"){
        buildWordCloud(document.getElementById("d-wc"),cachedComments,true);
      } else {
        renderDCommentList();
      }
    }
  });

  db.ref("session").on("value",s=>{
    const session=s.val();

    if(!session||!session.active){
      prevDMode=null; prevDDisplayMode=null;
      if(vListener){db.ref("votes").off("value",vListener);vListener=null;}
      if(dChart){dChart.destroy();dChart=null;}
      showD("d-standby"); document.getElementById("dml").textContent="待機中"; return;
    }

    const dm=session.displayMode||"list";
    const modeChanged = session.mode!==prevDMode;
    const displayModeChanged = dm!==prevDDisplayMode;
    prevDMode=session.mode; prevDDisplayMode=dm;

    if(session.mode==="comment"){
      document.getElementById("dml").textContent=dm==="cloud"?"💬 ワードクラウド":"💬 コメントモード";
      // 投票リスナーを解除
      if(vListener){db.ref("votes").off("value",vListener);vListener=null;}
      if(dChart){dChart.destroy();dChart=null;}
      if(modeChanged||displayModeChanged){
        if(dm==="cloud"){
          showD("d-wc");
          buildWordCloud(document.getElementById("d-wc"),cachedComments,true);
        } else {
          showD("d-cl");
          renderDCommentList();
        }
      }
    } else if(session.mode==="vote"&&session.vote){
      document.getElementById("dml").textContent="📊 投票モード";
      if(modeChanged){
        showD("d-vp");
        document.getElementById("dvnum").textContent="Q"+((session.voteIdx!==undefined?session.voteIdx:0)+1);
        document.getElementById("dvq").textContent=session.vote.question||"投票";
        currentDVote=session.vote;
        // 投票リスナーを再設定
        if(vListener){db.ref("votes").off("value",vListener);vListener=null;}
        vListener=db.ref("votes").on("value",snap=>{
          const opts=session.vote.options||[]; const counts={};
          opts.forEach(o=>{counts[o]=0;});
          snap.forEach(v=>{const a=v.val().answer;if(counts[a]!==undefined)counts[a]++;});
          const total=Object.values(counts).reduce((a,b)=>a+b,0);
          document.getElementById("dvt").textContent=total;
          buildDChart(opts,counts,session.vote.chartType||"horizontal");
        });
      }
    }
  });

  // コメントリスト描画（display画面用）
  function renderDCommentList(){
    const list=document.getElementById("d-cls"); list.innerHTML="";
    const items=[...cachedComments];
    items.sort((a,b)=>{if(a.pinned&&!b.pinned)return -1;if(!a.pinned&&b.pinned)return 1;return a.timestamp-b.timestamp;});
    items.slice(-30).forEach(item=>{
      const card=document.createElement("div"); card.className="dcc"+(item.pinned?" pin":"");
      const time=new Date(item.timestamp).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
      card.innerHTML="<div class='dcm'>"+(item.pinned?"<span style='color:#FFF21A;font-size:9px;'>📌</span>":"")+"<span class='dcn'>"+esc(item.name||"匿名")+"</span><span class='dct'>"+time+"</span></div><div class='dcx'>"+esc(item.text)+"</div>";
      list.appendChild(card);
    });
    list.scrollTop=list.scrollHeight;
  }

  const DCOLS=["#49C1F0","#E95098","#93C85A","#FFF21A","#FF8C42","#A855F7","#22D3EE","#FB923C"];
  function buildDChart(labels,counts,type){
    if(dChart){dChart.destroy();dChart=null;}
    const data=labels.map(l=>counts[l]||0); const isH=type==="horizontal";
    dChart=new Chart(document.getElementById("dchart"),{
      type:type==="doughnut"?"doughnut":"bar",
      data:{labels,datasets:[{label:"票数",data,backgroundColor:DCOLS.map(c=>c+"cc"),borderColor:DCOLS,borderWidth:2,borderRadius:type!=="doughnut"?5:0}]},
      options:{indexAxis:isH?"y":"x",responsive:true,maintainAspectRatio:false,animation:{duration:600},
        plugins:{legend:{display:type==="doughnut",labels:{color:"#fff",font:{family:"メイリオ,Meiryo,sans-serif",size:12},padding:14}},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);const p=t>0?Math.round(c.raw/t*100):0;return " "+c.raw+" 票（"+p+"%）";  }}}},
        scales:type!=="doughnut"?{x:{ticks:{color:"rgba(255,255,255,0.7)",font:{family:"メイリオ,Meiryo,sans-serif",size:11}},grid:{color:"rgba(255,255,255,0.07)"}},y:{ticks:{color:"rgba(255,255,255,0.7)",font:{family:"メイリオ,Meiryo,sans-serif",size:11}},grid:{color:"rgba(255,255,255,0.07)"},beginAtZero:true}}:{}}
    });
  }
}
</script>
